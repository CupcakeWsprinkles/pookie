<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Bubbly Font von Google Fonts -->
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Fredoka', cursive, sans-serif;
      
      
      background-color: #ffb6c1; /* Fallback-Farbe, falls das GIF noch lädt */
    }

    /* Retro Computer Window Design */
    .window {
      background-color: #ece9d8;
      border: 3px solid #0054e3;
      border-radius: 8px 8px 4px 4px;
      box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .title-bar {
      background: linear-gradient(180deg, #0997ff 0%, #0053ee 8%, #0050ee 40%, #06f 88%, #06f 93%, #005bff 95%, #003dd7 96%, #003dd7 100%);
      color: white;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .window-controls {
      display: flex;
      gap: 4px;
    }

    .control-btn {
      width: 18px;
      height: 18px;
      background: #ece9d8;
      color: #000;
      border: 1px solid #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      border-radius: 3px;
      font-size: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    .control-btn.close {
      background: #e04343;
      color: white;
    }

    .window-body {
      padding: 24px 20px;
      text-align: center;
      color: #222;
    }

    .message {
      font-size: 22px;
      line-height: 1.35;
      margin-bottom: 24px;
      word-wrap: break-word;
    }

    .message.final-text {
      font-size: 18px;
      text-align: left;
      line-height: 1.5;
    }

    /* Button Container & Umrahmte Kästen */
    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 16px;
      font-weight: 500;
      padding: 10px 16px;
      background-color: #ffffff;
      color: #000;
      border: 2px solid #000;
      border-radius: 6px;
      box-shadow: 3px 3px 0px #000;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      touch-action: manipulation;
    }

    .btn:active:not(.disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    /* Nicht anklickbare Buttons */
    .btn.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background-color: #d3d3d3;
      box-shadow: 1px 1px 0px #666;
    }

    /* Spezial-Layout für das GIF in Weg 1,21 */
    .gif-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      max-width: 95vw;
      animation: popIn 0.25s ease-out;
    }

    .gif-stage img {
      max-width: 70vw;
      max-height: 70vh;
      border: 4px solid #fff;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
